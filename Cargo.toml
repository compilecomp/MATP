# CEP:FILE: Cargo.toml (workspace root, package mapt)
# CEP:WHAT: Cargo workspace manifest for MAPT: hot (CEP-0), cold (CEP-1), config, target crates plus the root test and bench package.
# CEP:WHY: A single workspace gives one lockfile (supply-chain pinning, CEP&CC 22.11), explicit test and bench target declarations (determinism, CEP&CC 38.10), and shared pinned profile settings (deterministic builds, CEP&CC 6.5).
# CEP:CLASS: CEP-1
# CEP:STATUS: complete
# CEP:FAILURE: Cargo fails at parse time if this file is malformed; no runtime failure.
# CEP:ASSUMES: Build directory is redirected to build/ via .cargo/config.toml so the source tree target/ is not shadowed; enforced by repository layout.
# CEP:COST: offline manifest; runtime cost irrelevant.
# CEP:EVIDENCE: CI job rust-checks builds this workspace with --locked.
# CEP:SECURITY: Zero third-party dependencies; all members are first-party path dependencies (vendoring not required, CEP&CC 22.11).

[workspace]
resolver = "2"
members = [
    "hot",
    "cold",
    "config",
    "target",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99.0"

[package]
name = "mapt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "mapt"
path = "src/lib.rs"

[dependencies]
mapt-hot = { path = "hot" }
mapt-cold = { path = "cold" }
mapt-config = { path = "config" }
mapt-target = { path = "target" }

